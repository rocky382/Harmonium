<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Harmonium Pro</title>

  <!-- iOS STANDALONE / HEADLESS META TAGS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harmonium">

  <!-- LINK TO REPO MANIFEST -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180">
  <link rel="icon" id="site-favicon" type="image/png">

  <!-- SCRIPT TO REGISTER SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
